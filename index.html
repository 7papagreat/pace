<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16213A">
<title>Pace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316213A'/><rect x='18' y='44' width='64' height='12' rx='6' fill='%23394866'/><rect x='18' y='44' width='34' height='12' rx='6' fill='%23fff'/><rect x='52' y='36' width='24' height='28' rx='6' fill='%23D9951A'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2316213A'/><rect x='18' y='44' width='64' height='12' rx='6' fill='%23394866'/><rect x='18' y='44' width='34' height='12' rx='6' fill='%23fff'/><rect x='52' y='36' width='24' height='28' rx='6' fill='%23D9951A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#16213A; --muted:#5C6780; --line:#D9DEE6;
  --turmeric:#D9951A; --turm-soft:rgba(217,149,26,.18); --leaf:#2F8A5B; --berry:#B23A5E; --sky:#3A78C2;
  --on-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1626;--surface:#172136;--surface2:#1F2B45;--ink:#E8ECF4;--muted:#9AA5BD;--line:#2A3754;
    --turmeric:#F0B23E;--turm-soft:rgba(240,178,62,.2);--leaf:#4CB97F;--berry:#E0678A;--sky:#6AA5E8;--on-ink:#0F1626}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15;margin:0;font-weight:800}
h2{font-size:1.25rem;margin:0 0 .5rem;font-weight:700}
h3{font-size:1.02rem;margin:0 0 .35rem;font-weight:700}
p{margin:.35rem 0}
a{color:var(--sky)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:28px;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ink) 55%,var(--turmeric) 55%)}
.sync{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok b{background:var(--leaf)} .sync.warn b{background:var(--berry)} .sync.busy b{background:var(--turmeric)}
.lvl{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}

main{max-width:1040px;margin:0 auto;padding:8px 16px 150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.flat{background:transparent;border-style:dashed}
.grid2{display:grid;gap:0 16px}
@media (min-width:860px){.grid2{grid-template-columns:1.1fr .9fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.stack>*+*{margin-top:8px}

.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 13px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.accent{background:var(--turmeric);color:#1b1405;border-color:var(--turmeric);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.88rem;border-radius:8px}
.btn.icon{padding:4px 9px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=url],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;min-width:0}
textarea{resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ----- the day track ----- */
.hero{padding:14px 0 4px}
.hero .when{font-size:.95rem;color:var(--muted)}
.track{position:relative;height:92px;margin:14px 4px 4px}
.rail{position:absolute;left:0;right:0;top:44px;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.past{position:absolute;top:44px;height:12px;border-radius:999px;background:var(--ink)}
.window{position:absolute;top:30px;height:40px;border-radius:12px;background:var(--turm-soft);border:2px solid var(--turmeric)}
.nowdot{position:absolute;top:38px;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--turmeric)}
.pin{position:absolute;top:4px;transform:translateX(-50%);text-align:center;font-size:.72rem;color:var(--muted);line-height:1}
.pin b{display:block;margin:4px auto 0;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.pin.done b{background:var(--ink)}
.trainseg{position:absolute;top:44px;height:12px;border-radius:999px;background:var(--sky)}
.cut{position:absolute;top:62px;width:2px;height:10px;background:var(--berry);margin-left:-1px}
.tick{position:absolute;top:76px;font-size:.74rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:2px 4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* ----- next 3 hours ----- */
.next{list-style:none;margin:0;padding:0}
.next li{padding:10px 0 10px 14px;border-left:4px solid var(--c,var(--line));margin:8px 0;background:linear-gradient(90deg,var(--surface2),transparent 70%);border-radius:0 10px 10px 0}
.next li .t{font-weight:700}
.next li.low{opacity:.75}
.next li.done .t::after{content:" ✓";color:var(--leaf)}
.k-food{--c:var(--turmeric)} .k-water{--c:var(--sky)} .k-steps{--c:var(--leaf)} .k-stand{--c:var(--leaf)}
.k-supp{--c:var(--muted)} .k-train{--c:var(--sky)} .k-cut{--c:var(--berry)} .k-sleep{--c:var(--ink)} .k-info{--c:var(--muted)}

/* ----- metric rows ----- */
.m{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.m .l{font-size:.92rem}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--ink))}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--turmeric);text-decoration:none}
.m .v{font-size:.86rem;text-align:right;white-space:nowrap}
.m .s{grid-column:2/4;font-size:.78rem;color:var(--muted);margin-top:-6px}
.st-behind{--c:var(--berry)} .st-ahead,.st-done,.st-on{--c:var(--leaf)} .st-over{--c:var(--berry)} .st-neutral{--c:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.quick .btn{padding:11px 8px;text-align:center}

/* ----- lists ----- */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.tag{font-size:.72rem;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.weighed{border-color:var(--leaf);color:var(--leaf)}
.tag.described{border-color:var(--berry);color:var(--berry)}
.results{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:9px 11px;cursor:pointer}
.results button:hover{background:var(--surface2)}
.plate li{flex-wrap:wrap}.plate li .grow{flex-basis:calc(100% - 50px)}.plate li select,.plate li input{flex:1 1 90px}
.stars button{background:none;border:0;padding:0 1px;cursor:pointer;font-size:1.05rem;color:var(--line)}
.stars button.on{color:var(--turmeric)}

/* ----- planner ----- */
.plan{overflow-x:auto}
.plan table{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.plan th{font-size:.82rem;color:var(--muted);font-weight:400;text-align:left}
.plan td{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;vertical-align:top;font-size:.88rem;width:32%}
.plan td.today{border-color:var(--turmeric)}
.plan td.off{background:transparent;border-style:dashed;color:var(--muted)}
.plan td .acts{display:flex;gap:4px;margin-top:6px}

/* ----- charts ----- */
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--ink)} .chart .b.hit{fill:var(--leaf)} .chart .b.miss{fill:var(--berry)}
.chart .tg{stroke:var(--turmeric);stroke-width:2;stroke-dasharray:5 4;fill:none}
.chart .ln{stroke:var(--sky);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--sky)}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .num{font-size:1.5rem;font-weight:800;line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:3px;font-size:.85rem}
.badge.locked{opacity:.45}
.prog{height:8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--turmeric)}

/* ----- tabs ----- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button.on svg{color:var(--turmeric)}

/* ----- chat ----- */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(15,22,38,.25)}
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,15,28,.45)}
.sheet.open{display:block}
.sheet-in{position:absolute;right:0;bottom:0;top:0;width:min(460px,100%);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px 16px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.acts-card{border:1px dashed var(--turmeric);border-radius:12px;padding:10px;margin:4px 0 10px;background:var(--surface)}
.composer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:999px;font-size:.92rem;display:none}
.toast.show{display:block}
.warnbox{border:1px solid var(--turmeric);background:var(--turm-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
@media (prefers-reduced-motion:no-preference){.window{transition:left .4s,width .4s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i aria-hidden="true"></i>Pace</div>
  <span class="lvl" id="lvl"></span>
  <div class="sync" id="sync"><b></b><span></span></div>
</div></header>
<main id="main"></main>
<button class="fab" data-act="openChat">Ask Pace</button>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet" id="chat" aria-hidden="true"><div class="sheet-in" role="dialog" aria-label="Chat with Pace">
  <div class="sheet-head"><h2 style="margin:0">Ask Pace</h2><span class="muted small" style="flex:1">Tell it what you ate or how you feel</span><button class="btn sm" data-act="closeChat">Close</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="row" style="padding:0 16px 6px" id="chatChips"></div>
  <div class="composer"><textarea id="chatIn" rows="1" placeholder="e.g. had 2 chicken rolls at the canteen, feeling full"></textarea><button class="btn primary" data-act="sendChat">Send</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   Pace — personal pacing tracker
   Data lives in localStorage and syncs to your Google Sheet.
   ========================================================= */

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const toMin = t => { if (!t && t !== 0) return null; const [h, m] = String(t).split(':').map(Number); return isFinite(h) ? h * 60 + (m || 0) : null; };
const hhmm = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(Math.round(m) % 60);
const fmtMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; let h = Math.floor(m / 60); const mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(mm) + ' ' + ap; };
const nowClock = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n * 10) / 10;
const fmtN = n => Math.round(n).toLocaleString('en-IN');
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const weekday = ds => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(ds + 'T12:00:00').getDay()];
const mondayOf = ds => { const d = new Date(ds + 'T12:00:00'); const k = (d.getDay() + 6) % 7; return addDays(ds, -k); };
const niceDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });

/* ---------- seed data (from your list + your cook chat) ---------- */
// [id, name, serving, grams, kcal, protein, carbs, fat, fibre, diet, slots, rating, cook name]
const SEED_DISHES = [
  ['keema','Chicken keema','1 katori (~150 g cooked)',150,285,27,6,17,1.5,'nonveg','breakfast,lunch,dinner',5,'chicken keema'],

  ['egg_boiled','Boiled egg','1 egg',50,72,6.3,0.4,4.8,0,'egg','breakfast,lunch,snack',4,'boiled egg'],

  ['do_pyaza','Chicken do pyaza','1 serving (~250 g)',250,350,30,12,20,3,'nonveg','lunch,dinner',4,'chicken do pyaza'],
  ['keema_paratha','Chicken keema paratha','1 paratha',120,300,15,32,12,3,'nonveg','breakfast,lunch,dinner',5,'chicken keema stuffed paratha'],
  ['paneer_bhurji','Paneer bhurji','1 serving (100 g paneer)',160,340,19,9,25,2,'veg','breakfast,lunch,dinner',5,'paneer bhurji (100g paneer)'],
  ['pp_paratha','Paneer + pyaaz stuffed paratha','1 paratha',130,290,10,33,13,3,'veg','breakfast,lunch,dinner',5,'paneer pyaaz stuffed paratha'],
  ['besan_chilla','Besan chilla','1 chilla',90,160,7,18,6,3,'veg','breakfast,lunch',4,'besan chilla'],
  ['chicken_roll','Chicken roll','1 roll',180,330,17,35,13,2,'nonveg','lunch,dinner,snack',5,'chicken roll'],

  ['momos','Chicken momos','1 piece',30,45,3,5,1.5,0.3,'nonveg','lunch,snack,dinner',4,'chicken momos'],
  ['paneer_pulao','Paneer pulao','1 plate (30 g rice, 100 g paneer)',260,430,21,32,25,2,'veg','lunch,dinner',4,'paneer pulao (30g rice, 100g paneer)'],
  ['milkshake','Milkshake (banana, PB, oats)','1 glass (500 ml milk)',650,725,29,83,33,7,'veg','breakfast,snack',5,'milkshake'],
  ['roti','Roti','1 roti',40,110,3.5,21,1,3,'veg','lunch,dinner',3,'roti'],
  ['paratha','Plain paratha','1 paratha',70,200,4.5,28,8,3.5,'veg','breakfast,lunch,dinner',3,'plain paratha'],
  ['aloo_paratha','Aloo pyaaz paratha','1 paratha',120,260,5.5,38,10,4,'veg','breakfast,dinner',4,'aloo pyaaz paratha'],
  ['pav','Pav','1 pav',40,135,4,24,2.5,1,'veg','breakfast,dinner',3,'pav'],
  ['rice','Rice (per 30 g raw)','30 g raw rice, cooked',30,107,2.1,23.7,0.3,0.4,'veg','lunch,dinner',3,'30g rice'],
  ['raita','Raita / curd','1 katori',150,90,5,7,4,0.5,'veg','lunch,dinner',3,'raita'],
  ['egg_bhurji','Egg bhurji','2 eggs',130,190,13,3,14,0.5,'egg','breakfast,dinner',4,'2 eggs ki bhurji'],
  ['chhole','Chhole','1 katori',150,210,9,28,7,8,'veg','lunch,dinner',4,'chhole'],
  ['dal','Dal tadka','1 katori',150,150,8,20,4,5,'veg','lunch,dinner',3,'dal'],
  ['sprouts','Sprouts + peanut salad','1 bowl',150,200,11,22,8,7,'veg','breakfast,lunch,snack',4,'sprouts aur peanuts salad'],
  ['egg_sandwich','Boiled egg sandwich','1 sandwich',120,230,11,27,8,2,'egg','breakfast,snack',4,'boiled egg sandwich'],
  ['paneer_sandwich','Paneer sandwich','1 sandwich',140,300,13,28,15,2,'veg','breakfast,snack',4,'paneer sandwich'],

  if (!up.length && rem.length) out.push({ k: 'food', low: true, text: `Next meal: ${rem[0].label.toLowerCase()} at ${fmtMin(rem[0].t)}`, sub: `Aim for about ${Math.min(cap, Math.round(remP * rem[0].w / wsum))} g protein then.` });
  // water
  const wEnd = W.bed - 90;
  if (n < wEnd) {
    const Hh = Math.min(H, wEnd), dur = Hh - n;
    const need = Math.round((T.water * curve('water', Hh, W, meals) - A.water) / 50) * 50, capW = Math.round(1200 * dur / 180 / 50) * 50;
    if (need <= 0) out.push({ k: 'water', done: true, text: 'Water: on pace', sub: `${fmtN(A.water)} of ${fmtN(T.water)} ml so far.` });
    else { const amt = Math.min(need, capW); out.push({ k: 'water', text: `Drink ${fmtN(amt)} ml`, sub: need > capW ? `You're ${fmtN(need - capW)} ml further behind; spread it over the evening rather than forcing it now.` : `About ${fmtN(Math.max(50, Math.round(amt / (dur / 60) / 50) * 50))} ml an hour.` }); }
  } else out.push({ k: 'water', low: true, text: 'Water taper', sub: 'Just sip if thirsty so sleep stays unbroken.' });
  // steps
  const sEnd = W.bed - 60;
  if (n < sEnd) {
    const Hs = Math.min(H, sEnd), dur = Hs - n;
    const need = Math.round((T.steps * curve('steps', Hs, W, meals) - A.steps) / 100) * 100, capS = Math.round(4000 * dur / 180 / 100) * 100;
    if (need <= 0) out.push({ k: 'steps', done: true, text: 'Steps: on pace', sub: `${fmtN(A.steps)} of ${fmtN(T.steps)} so far.` });
    else { const amt = Math.min(need, capS); out.push({ k: 'steps', text: `Walk ${fmtN(amt)} steps`, sub: `Roughly ${Math.max(5, Math.round(amt / 100))} minutes of walking${need > capS ? `; the other ${fmtN(need - capS)} can come later this evening` : ''}.` }); }
  }
  // standing
  const stNeed = Math.ceil(T.stand * curve('stand', Math.min(H, W.bed - 60), W, meals) - A.stand);
  if (stNeed > 0) out.push({ k: 'stand', text: `Stand for ${Math.min(stNeed, 3)} of the next 3 hours`, sub: 'Tap "I stood" after each one.' });
  // creatine
  if (A.creatine < T.creatine) out.push({ k: 'supp', text: `Take ${T.creatine} g creatine`, sub: 'Timing is flexible; with your next meal is easiest.' });
  // training
  const tt = toMin(c.train_time);
  if (tt != null && c.day_type && c.day_type !== 'rest') {
    const lab = (DAY_TYPES.find(x => x[0] === c.day_type) || [, 'Training'])[1];
    if (tt > n && tt <= H) out.push({ k: 'train', text: `${lab} at ${fmtMin(tt)}`, sub: 'Have some easy carbs 60 to 90 minutes before, and about 500 ml water around the session.' });
    const ate = (S.idx[d] || []).some(r => r.kind === 'food' && toMin(String(r.ts).slice(11, 16)) >= tt + 30);
    if (n >= tt + 45 && n <= tt + 180 && !ate) out.push({ k: 'train', text: 'Post-workout meal', sub: `Get ${Math.round(w * 0.4)}+ g protein in the next hour or two.` });
  }
  // sleep cutoffs
  [[W.bed - 480, 'Caffeine cutoff', 'Skip chai and coffee after this so it doesn\'t cut into sleep.'],
   [W.bed - 150, 'Last big meal', 'Keep anything later small.'],
   [W.bed - 45, 'Wind down', `Screens down, lights low, bed at ${fmtMin(W.bed)}.`]].forEach(([t, l, s]) => { if (t > n && t <= H) out.push({ k: 'cut', text: `${l} at ${fmtMin(t)}`, sub: s }); });
  return out;
}

/* ---------- gamification ---------- */
function dayEval(d) {
  const T = targets(d), A = totals(d), r = k => T[k] ? A[k] / T[k] : 0, tier = x => x >= .9 ? 10 : x >= .75 ? 5 : 0;
  let pts = tier(r('protein')) + tier(r('water')) + tier(r('steps')) + tier(r('fibre'));
  const kc = r('kcal'); pts += (kc >= .9 && kc <= 1.1) ? 10 : (kc >= .8 && kc <= 1.2) ? 5 : 0;
  if (A.creatine >= T.creatine) pts += 5; if (A.stand >= T.stand) pts += 5; if (checkin(d)) pts += 5; if (A.foods >= 3) pts += 5; if (A.weighed) pts += 3;
  return { pts, mvd: r('protein') >= .8 && r('water') >= .8, active: A.foods > 0 || A.water > 0 || !!checkin(d), A, T, hit: {
    protein: r('protein') >= .9, water: r('water') >= .9, steps: r('steps') >= .9, fibre: r('fibre') >= .9, stand: A.stand >= T.stand, creatine: A.creatine >= T.creatine } };
}
const CH_METRICS = { protein: 'protein target', water: 'water target', steps: 'step target', fibre: 'fibre target', stand: 'standing target', creatine: 'creatine' };
function challengeFor(monday, evals) {
  const prev = []; for (let i = 7; i >= 1; i--) { const e = evals[addDays(monday, -i)]; if (e && e.active) prev.push(e); }
  let metric = 'protein';
  if (prev.length >= 3) { let worst = 2; for (const m in CH_METRICS) { const rate = prev.filter(e => e.hit[m]).length / prev.length; if (rate < worst) { worst = rate; metric = m; } } }
  let done = 0; for (let i = 0; i < 7; i++) { const e = evals[addDays(monday, i)]; if (e && e.hit[metric]) done++; }
  return { metric, goal: 5, done, text: `Hit your ${CH_METRICS[metric]} on 5 of 7 days this week` };
}
function game() {
  if (S._memo && S._memo.G) return S._memo.G;
  const dates = [...S.db.Log.map(r => r.date), ...S.db.Checkins.map(c => c.date)].filter(Boolean).sort();
  const t = today(); const first = dates[0] || t;
  const evals = {}; let total = 0, cur = 0, best = 0, lastFreeze = -99, bestDay = 0, maxP = 0, maxSteps = 0;
  const all = []; for (let d = first; d <= t; d = addDays(d, 1)) all.push(d);
  all.forEach((d, i) => {
    const e = evals[d] = dayEval(d); total += e.pts; bestDay = Math.max(bestDay, e.pts); maxP = Math.max(maxP, e.A.protein); maxSteps = Math.max(maxSteps, e.A.steps);
    if (e.mvd) cur++; else if (d === t) {} else if (cur > 0 && i - lastFreeze >= 7) lastFreeze = i; else cur = 0;
    best = Math.max(best, cur);
  });
  const weeks = {}; all.forEach(d => { const m = mondayOf(d); weeks[m] = (weeks[m] || 0) + evals[d].pts; });
  let bonus = 0; Object.keys(weeks).forEach(m => { if (m < mondayOf(t)) { const c = challengeFor(m, evals); if (c.done >= c.goal) { bonus += 50; weeks[m] += 50; } } });
  const ch = challengeFor(mondayOf(t), evals);
  const pts = total + bonus, level = Math.floor((Math.sqrt(1 + 8 * pts / 150) - 1) / 2) + 1;
  const need = lv => 150 * lv * (lv - 1) / 2;
  const foods = S.db.Log.filter(r => r.kind === 'food').length, weighed = S.db.Log.filter(r => r.confidence === 'weighed').length;
  const badges = [
    ['First check-in', S.db.Checkins.length > 0], ['First tape measurement', S.db.Measurements.length > 0], ['7-day streak', best >= 7],
    ['30-day streak', best >= 30], ['100 foods logged', foods >= 100], ['20 weighed entries', weighed >= 20], ['Challenge complete', bonus > 0],
    ['Protein PR: 1.5x target', maxP >= 1.5 * targets(t).protein]
  ];
  return (S._memo.G = { evals, pts, level, into: pts - need(level), span: need(level + 1) - need(level), cur, best, freeze: (all.length - 1 - lastFreeze) >= 7,
    bestDay, bestWeek: Math.max(0, ...Object.values(weeks)), maxP, maxSteps, ch, badges });
}

/* ---------- meal planner ---------- */
function planWeek(monday) {
  const p = prof(), T = targets(today());
  const tgt = { breakfast: T.protein * (p.milkshake ? .12 : .25), lunch: T.protein * .3, dinner: T.protein * .3 };
  const used = {}, byDay = {};
  S.db.Plan.filter(x => x.date >= monday && x.date <= addDays(monday, 6)).forEach(x => { used[x.template_id] = (used[x.template_id] || 0) + 1; });
  for (let i = 0; i < 6; i++) { // Mon–Sat; Sunday the cook is off
    const d = addDays(monday, i);
    for (const [slot] of SLOTS) {
      const ex = S.db.Plan.find(x => x.date === d && x.slot === slot);
      if (ex && ex.locked === 'yes') continue;
      if (ex) used[ex.template_id]--;
      const prevDay = S.db.Plan.find(x => x.date === addDays(d, -1) && x.slot === slot);
      const today_ids = S.db.Plan.filter(x => x.date === d && x.slot !== slot).map(x => x.template_id);
      const cands = S.db.Templates.filter(t => String(t.slot).split(',').includes(slot));
      let bestT = null, bestS = -1e9;
      for (const t of cands) {
        const x = templateTotals(t);
        let s = num(t.rating) * 2 - Math.abs(x.protein - tgt[slot]) / 4 - 6 * (used[t.id] || 0) + Math.random() * 3;
        if (prevDay && prevDay.template_id === t.id) s -= 10;
        if (today_ids.includes(t.id)) s -= 12;
        if (s > bestS) { bestS = s; bestT = t; }
      }
      if (!bestT) continue;
      used[bestT.id] = (used[bestT.id] || 0) + 1;
      const row = { id: `p-${d}-${slot}`, date: d, slot, template_id: bestT.id, note: '', locked: 'no' };
      upsertIn(S.db, 'Plan', row); byDay[d] = 1;
      enqueue({ op: 'put', table: 'Plan', row });
    }
  }
  persist();
}
function cookMsg(d, part) {
  const p = prof(), line = slot => { const x = S.db.Plan.find(r => r.date === d && r.slot === slot); const t = x && tplById(x.template_id); return t ? (t.cook_text || t.name) : null; };
  if (part === 'morning') {
    const b = line('breakfast'), l = line('lunch'); const out = ['Didi, aaj subah:'];
    if (b) out.push('- ' + b); if (l) out.push('- Tiffin ke liye: ' + l); if (p.milkshake) out.push('- Milkshake (500ml milk, 1 banana, 2 spoon peanut butter, 30g oats, 1 spoon honey)');
    return out.length > 1 ? out.join('\n') : '';
  }
  const dn = line('dinner'); return dn ? 'Didi, aaj shaam:\n- ' + dn : '';
}

  const out = ['Didi, is hafte ka plan:'];
  for (let i = 0; i < 6; i++) {

function barsSVG(vals, tgts, hitFn) {
  const W = 600, H = 150, n = vals.length, max = Math.max(1, ...vals, ...tgts) * 1.12, bw = W / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  vals.forEach((v, i) => { const h = v / max * H; s += `<rect class="b ${v ? (hitFn(i) ? 'hit' : 'miss') : ''}" x="${i * bw + bw * .15}" y="${H - h}" width="${bw * .7}" height="${h}" rx="3"/>`; });
  s += `<polyline class="tg" points="${tgts.map((t, i) => `${i * bw},${H - t / max * H} ${(i + 1) * bw},${H - t / max * H}`).join(' ')}"/></svg>`;
  return s;
}
function lineSVG(pts) {
  if (pts.length < 2) return `<p class="muted small">Add a couple more weigh-ins to see a trend.</p>`;
  const W = 600, H = 150, ys = pts.map(p => p[1]), lo = Math.min(...ys) - 0.5, hi = Math.max(...ys) + 0.5, x0 = pts[0][0], x1 = pts[pts.length - 1][0] || 1;
  const X = x => (x - x0) / ((x1 - x0) || 1) * (W - 20) + 10, Y = y => H - 10 - (y - lo) / ((hi - lo) || 1) * (H - 20);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="ln" points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>${pts.map(p => `<circle class="pt" cx="${X(p[0])}" cy="${Y(p[1])}" r="4"/>`).join('')}</svg>
    <div class="axis"><span>${lo.toFixed(1)} kg low</span><span>${hi.toFixed(1)} kg high</span></div>`;
}

      if (a && a.items && a.items.length) h += `<div class="acts-card small">${a.items.map(describeAction).join('<br>')}<div class="row" style="margin-top:8px">${a.applied ? `<span class="muted">Logged</span>` : `<button class="btn sm accent" data-act="applyActs" data-v="${esc(r.id)}">Log these</button><button class="btn sm ghost" data-act="skipActs" data-v="${esc(r.id)}">Skip</button>`}</div></div>`;
    }
  });
  if (S.chatBusy) h += `<div class="msg assistant muted">Thinking…</div>`;
  $('#msgs').innerHTML = h; $('#msgs').scrollTop = 1e9;
  $('#chatChips').innerHTML = ['I\'m feeling full', 'What should I eat next?', 'Not in the mood for '].map(c => `<button class="chip small" data-act="chip" data-v="${esc(c)}">${esc(c.trim())}</button>`).join('');
}
function describeAction(a) {
  if (a.type === 'food') { const d = a.dish_id && dishById(a.dish_id); const x = d ? dishTotals(d, a.qty || 1, 'serving') : a; return `Food: ${esc(a.name || (d && d.name))} × ${a.qty || 1} (${Math.round(num(x.kcal))} kcal, ${r1(num(x.protein))} g P)`; }
  if (a.type === 'water') return `Water: ${fmtN(num(a.ml))} ml`;
  if (a.type === 'creatine') return `Creatine: ${num(a.g)} g`;
  if (a.type === 'stand') return `Stood: ${num(a.hours) || 1} h`;
  if (a.type === 'steps') return `Steps: +${fmtN(num(a.steps))}`;
  if (a.type === 'feeling') return `Feeling: ${esc(a.text)}`;
  if (a.type === 'weight') return `Weight: ${num(a.kg)} kg`;
  return esc(JSON.stringify(a));
}
function chatContext() {
  const d = today(), T = targets(d), A = totals(d), p = prof();
  return { now: new Date().toLocaleString('en-IN'), profile: { age: p.age, height_cm: p.height, weight_kg: T.weight, goal: p.goal, day_type: T.dayType, bodyfat_est: T.bf },
    targets: Object.fromEntries(Object.keys(METRICS).map(k => [k, T[k]])), today_totals: Object.fromEntries(Object.keys(METRICS).map(k => [k, A[k]])),
    next_3_hours: next3h(d).map(i => i.text + (i.sub ? ' (' + i.sub + ')' : '')),
    plan_today: SLOTS.map(([s]) => { const x = plannedFor(d, s); return x ? `${s}: ${x.name}` : null; }).filter(Boolean),
    logged_today: (S.idx[d] || []).filter(r => r.kind === 'food').map(r => r.name),
    feelings_today: (S.idx[d] || []).filter(r => r.kind === 'feeling').map(r => `${String(r.ts).slice(11, 16)} ${r.name}`),
    dishes: S.db.Dishes.map(x => [x.id, x.name, x.serving, x.kcal, x.protein, x.carbs, x.fat, x.fibre]) };
}
async function sendChat(text) {
  text = (text || '').trim(); if (!text || S.chatBusy) return;
  if (!S.cfg.url) { toast('Connect your Google Sheet in Me first; chat runs through it.'); return; }
  const d = today(), tmpId = uid('u');
  S.db.Chat.push({ id: tmpId, ts: new Date().toISOString().slice(0, 19), date: d, role: 'user', text, actions: '' });
  S.chatBusy = true; $('#chatIn').value = ''; renderChat();
  try {
    const j = await api('chat', { message: text, context: chatContext(), date: d, userId: tmpId });
    S.db.Chat = S.db.Chat.filter(r => r.id !== tmpId); S.db.Chat.push(j.userRow, j.botRow); persist();
  } catch (e) {
    S.db.Chat.push({ id: uid('a'), ts: new Date().toISOString().slice(0, 19), date: d, role: 'assistant', text: 'Could not reach Pace: ' + e.message, actions: '' });
  }
  S.chatBusy = false; renderChat();
}
function applyActions(rowId) {
  const r = S.db.Chat.find(x => x.id === rowId); if (!r) return;
  let a; try { a = JSON.parse(r.actions); } catch (e) { return; }
  const d = today(), ts = d + 'T' + hhmm(nowClock()) + ':00';
  a.items.forEach(x => {
    const base = { id: uid('l'), date: d, ts, source: 'chat' };
    if (x.type === 'food') {
      const dish = x.dish_id && dishById(x.dish_id); const q = num(x.qty) || 1;
      const n = dish ? dishTotals(dish, q, 'serving') : { kcal: num(x.kcal), protein: num(x.protein), carbs: num(x.carbs), fat: num(x.fat), fibre: num(x.fibre) };
      save('Log', { ...base, kind: 'food', name: x.name || (dish && dish.name), dish_id: dish ? dish.id : '', qty: q, unit: 'serving', grams: '', ...n, confidence: x.confidence || 'described' });
    } else if (x.type === 'water') save('Log', { ...base, kind: 'water', name: 'Water', water_ml: num(x.ml) });
    else if (x.type === 'creatine') save('Log', { ...base, kind: 'creatine', name: 'Creatine', value: num(x.g) || prof().creatine });
    else if (x.type === 'stand') save('Log', { ...base, kind: 'stand', name: 'Stood', value: num(x.hours) || 1 });
    else if (x.type === 'steps') save('Log', { ...base, kind: 'steps', name: 'Steps', value: num(x.steps) });
    else if (x.type === 'feeling') save('Log', { ...base, kind: 'feeling', name: x.text });
    else if (x.type === 'weight') { const c = checkin(d); if (c) save('Checkins', { ...c, weight: num(x.kg) }); else save('Measurements', { id: uid('m'), date: d, weight: num(x.kg) }); }
  });
  a.applied = true; save('Chat', { ...r, actions: JSON.stringify(a) });
  toast('Logged'); render();
}

/* ---------- actions ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const nowTs = (d = today(), t) => d + 'T' + (t || hhmm(nowClock())) + ':00';
function quickLog(kind, extra) { save('Log', { id: uid('l'), date: today(), ts: nowTs(), kind, source: 'quick', ...extra }); render(); }
function addToPlate(dish, qty = 1) { S.plate.push({ dish: { ...dish }, qty, unit: 'serving', grams: num(dish.grams) * qty, confidence: 'estimated' }); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { prompt('Copy this:', t); } }

const A = {
  tab: b => { S.tab = b.dataset.v; if (S.tab === 'log') S.day = S.day || today(); render(); window.scrollTo(0, 0); },
  water: b => { quickLog('water', { name: 'Water', water_ml: Number(b.dataset.v) }); toast(`+${b.dataset.v} ml water`); },
  creatine: () => { quickLog('creatine', { name: 'Creatine', value: prof().creatine }); toast('Creatine logged'); },
  stood: () => { quickLog('stand', { name: 'Stood', value: 1 }); toast('Standing hour logged'); },
  steps: b => { quickLog('steps', { name: 'Steps', value: Number(b.dataset.v) }); toast('Steps added'); },
  feel: () => { const t = val('feelIn'); if (!t) return; quickLog('feeling', { name: t }); toast('Noted. Your next 3 hours now account for it.'); },
  ciQ: b => { S.ciQ = Number(b.dataset.v); document.querySelectorAll('#ciQ .chip').forEach(c => c.classList.toggle('on', c === b)); },
  ciType: b => { const keep = { w: val('ciWake'), b: val('ciBed'), s: val('ciSleep'), kg: val('ciW') }; S.ciType = b.dataset.v; render(); const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; }; set('ciWake', keep.w); set('ciBed', keep.b); set('ciSleep', keep.s); set('ciW', keep.kg); },
  saveCheckin: () => {
    const d = today(), c = checkin(d) || {};
    const row = { id: 'c-' + d, date: d, wake: val('ciWake'), bed: val('ciBed'), sleep_hours: num(val('ciSleep')) || '', sleep_q: S.ciQ || c.sleep_q || '', weight: num(val('ciW')) || '', day_type: S.ciType || 'rest', train_time: S.ciType && S.ciType !== 'rest' ? val('ciT') : '', note: '' };
    save('Checkins', row); S.editingCheckin = false; toast('Day set. Here is your pace.'); render();
  },
  editCheckin: () => { const c = checkin(today()); S.ciType = c.day_type; S.ciQ = c.sleep_q; const el = document.createElement('div'); el.innerHTML = checkinForm(today()); $('.hero').after(el.firstElementChild); },
  cancelCheckin: () => render(),
  day: b => { S.day = addDays(S.day, Number(b.dataset.v)); if (S.day > today()) S.day = today(); render(); },
  addDish: b => { addToPlate(dishById(b.dataset.v)); render(); },
  addTpl: b => { templateItems(tplById(b.dataset.v)).forEach(([id, q]) => { const d = dishById(id); if (d) addToPlate(d, q); }); render(); },
  pDel: b => { S.plate.splice(Number(b.dataset.v), 1); render(); },
  clearPlate: () => { S.plate = []; render(); },
  addCustom: () => {
    const name = val('cName'); if (!name) { toast('Give it a name first'); return; }
    const dish = { id: 'x_' + Date.now().toString(36), name, serving: val('cServ') || '1 serving', grams: 100, kcal: num(val('cKcal')), protein: num(val('cP')), carbs: num(val('cC')), fat: num(val('cF')), fibre: num(val('cFi')), diet: 'veg', slots: 'lunch,dinner', rating: 3, source: 'order', cook_name: name };
    if ($('#cSave').checked) save('Dishes', dish);
    S.plate.push({ dish, qty: 1, unit: 'serving', grams: 100, confidence: 'described' }); render();
  },
  logPlate: () => {
    const d = S.day, t = val('logT') || hhmm(nowClock());
    S.plate.forEach(it => { const x = dishTotals(it.dish, it.qty, it.unit, it.grams);
      save('Log', { id: uid('l'), date: d, ts: nowTs(d, t), kind: 'food', name: it.dish.name, dish_id: it.dish.id, qty: it.unit === 'g' ? '' : it.qty, unit: it.unit, grams: it.unit === 'g' ? it.grams : '', ...x, confidence: it.confidence, source: 'manual' }); });
    S.plate = []; toast('Meal logged'); render();
  },
  saveTpl: () => {
    const name = prompt('Name this meal', S.plate.map(p => p.dish.name).join(' + ')); if (!name) return;
    const items = S.plate.filter(p => dishById(p.dish.id)).map(p => [p.dish.id, p.unit === 'g' ? r1(p.grams / (num(p.dish.grams) || 100)) : p.qty]);
    save('Templates', { id: uid('t'), name, items: JSON.stringify(items), slot: 'breakfast,lunch,dinner', rating: 4, cook_text: name }); toast('Saved as a meal');
  },
  delLog: b => { remove('Log', b.dataset.v); render(); },
  wk: b => { S.planWeek = addDays(S.planWeek, Number(b.dataset.v)); render(); },
  planWeek: () => { planWeek(S.planWeek); toast('Week planned'); render(); },
  reroll: b => {
    const [d, slot] = b.dataset.v.split('|'), ex = S.db.Plan.find(x => x.date === d && x.slot === slot);
    const cands = S.db.Templates.filter(t => String(t.slot).split(',').includes(slot) && (!ex || t.id !== ex.template_id));
    if (!cands.length) return;
    const weights = cands.map(t => Math.pow(num(t.rating) || 3, 2)), tot = weights.reduce((a, c) => a + c, 0); let r = Math.random() * tot, pick = cands[0];
    for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r <= 0) { pick = cands[i]; break; } }
    save('Plan', { id: `p-${d}-${slot}`, date: d, slot, template_id: pick.id, note: '', locked: 'no' }); render();
  },
  lock: b => { const x = S.db.Plan.find(r => r.id === b.dataset.v); save('Plan', { ...x, locked: x.locked === 'yes' ? 'no' : 'yes' }); render(); },
  copy: b => { const v = b.dataset.v; copyText(v === 'week' ? weekMsg(S.planWeek) : cookMsg(today(), v)); },
  rate: b => { const [id, s] = b.dataset.v.split('|'); save('Dishes', { ...dishById(id), rating: Number(s) }); render(); },
  editDish: b => { S.editDish = b.dataset.v || null; render(); },
  saveDish: b => {
    const g = k => val('e_' + k), id = b.dataset.v || ('x_' + Date.now().toString(36));
    if (!g('name')) { toast('Add a name'); return; }
    const old = dishById(id) || {};
    save('Dishes', { ...old, id, name: g('name'), serving: g('serving'), grams: num(g('grams')) || 100, kcal: num(g('kcal')), protein: num(g('protein')), carbs: num(g('carbs')), fat: num(g('fat')), fibre: num(g('fibre')), diet: g('diet'), slots: g('slots'), cook_name: g('cook_name') || g('name'), rating: old.rating || 4, source: old.source || 'cook' });
    S.editDish = null; toast('Dish saved'); render();
  },
  delDish: b => { if (confirm('Delete this dish? Past logs keep their numbers.')) { remove('Dishes', b.dataset.v); S.editDish = null; render(); } },
  range: b => { S.trendDays = Number(b.dataset.v); render(); },
  saveProfile: () => {
    ['age','height','weight','wake','bed','meal_breakfast','meal_lunch','meal_snack','meal_dinner','steps_target','stand_target','creatine_g'].forEach(k => { const v = val('p_' + k); if (v !== '' && v !== String(S.db.profile[k] ?? '')) setProfile(k, v); });
    ['sex','goal'].forEach(k => { const v = val('p_' + k); if (v !== S.db.profile[k]) setProfile(k, v); });
    toast('Profile saved'); render();
  },
  saveTargets: () => { Object.keys(METRICS).forEach(k => { const v = val('t_' + k); if (v !== String(S.db.profile['t_' + k] ?? '')) setProfile('t_' + k, v); }); toast('Targets saved'); render(); },
  saveMeasure: () => {
    const row = { id: uid('m'), date: today(), note: '' }; let any = false;
    ['weight','waist','neck','chest','arm','thigh','hip'].forEach(k => { const v = num(val('m_' + k)); row[k] = v || ''; if (v) any = true; });
    if (!any) { toast('Enter at least one measurement'); return; }
    save('Measurements', row); if (row.weight) setProfile('weight', row.weight); toast('Measurements saved'); render();
  },
  delMeasure: b => { remove('Measurements', b.dataset.v); render(); },
  connect: async () => {
    S.cfg = { url: val('cfgUrl'), token: val('cfgTok') }; localStorage.setItem('pace.cfg', JSON.stringify(S.cfg));
    if (!S.cfg.url) { S.sync = 'local'; render(); return; }
    try {
      const j = await api('ping');
      const hasLocal = S.db.Log.length || S.db.Checkins.length || S.db.Measurements.length;
      if (hasLocal && confirm('Upload the data already saved on this device to your Sheet?')) {
        TABLES.forEach(t => S.db[t].forEach(row => S.queue.push({ op: 'put', table: t, row })));
        Object.entries(S.db.profile).forEach(([key, value]) => S.queue.push({ op: 'put', table: 'Profile', row: { key, value } }));
        saveQueue(); await flush();
      }
      toast(j.chat ? 'Connected. Chat is on.' : 'Connected. Add GEMINI_API_KEY to turn on chat.');
      await pull();
    } catch (e) { S.sync = 'offline'; S.syncErr = e.message; render(); }
  },
  pull: () => { flush().then(pull); },
  export: () => { const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pace-backup-${today()}.json`; a.click(); },
  openChat: () => { $('#chat').classList.add('open'); $('#chat').setAttribute('aria-hidden', 'false'); renderChat(); setTimeout(() => $('#chatIn').focus(), 50); },
  closeChat: () => { $('#chat').classList.remove('open'); $('#chat').setAttribute('aria-hidden', 'true'); },
  sendChat: () => sendChat($('#chatIn').value),
  chip: b => { const v = b.dataset.v; if (v.endsWith(' ')) { $('#chatIn').value = v; $('#chatIn').focus(); } else sendChat(v); },
  applyActs: b => applyActions(b.dataset.v),
  skipActs: b => { const r = S.db.Chat.find(x => x.id === b.dataset.v); try { const a = JSON.parse(r.actions); a.applied = true; a.items = []; save('Chat', { ...r, actions: JSON.stringify(a) }); } catch (e) {} renderChat(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (e.target.closest('#chat') && e.target.id === 'chat') return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
$('#chat').addEventListener('click', e => { if (e.target.id === 'chat') A.closeChat(); });
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'search') { S.search = e.target.value; $('#results').innerHTML = resultsHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.change; if (!k) return;
  const it = S.plate[Number(t.dataset.i)];
  if (k === 'pUnit') { it.unit = t.value; if (it.unit === 'g') it.grams = Math.round(num(it.dish.grams) * it.qty); else it.qty = r1(it.grams / (num(it.dish.grams) || 100)) || 1; }
  else if (k === 'pQty') { if (it.unit === 'g') it.grams = num(t.value); else it.qty = num(t.value); }
  else if (k === 'pConf') it.confidence = t.value;
  else if (k === 'milkshake') { setProfile('milkshake_daily', t.checked ? 'yes' : 'no'); }
  render();
});
$('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') A.closeChat(); });

/* ---------- boot ---------- */
reindex();
S.sync = S.cfg.url ? 'saving' : 'local';
render();
if (S.cfg.url) { flush().then(pull); }
setInterval(() => { if (S.tab === 'today' && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);
setInterval(flush, 30000);
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg.url) flush().then(pull); });
</script>
</body>
