<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1626" media="(prefers-color-scheme: dark)">
<title>Pace</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#17223B; --muted:#58637A; --line:#D7DCE4;
  --turmeric:#D4901A; --turm-soft:rgba(212,144,26,.17); --leaf:#2E8657; --chili:#B8364F; --sky:#3571B5;
  --on-ink:#FFFFFF; --shadow:0 10px 30px rgba(23,34,59,.16);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1626;--surface:#172136;--surface2:#1F2B45;--ink:#E8ECF4;--muted:#9BA6BE;--line:#2A3754;
    --turmeric:#EFB13E;--turm-soft:rgba(239,177,62,.2);--leaf:#4CB97F;--chili:#E4687F;--sky:#6AA5E8;--on-ink:#0F1626;--shadow:0 10px 30px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#0F1626;--surface:#172136;--surface2:#1F2B45;--ink:#E8ECF4;--muted:#9BA6BE;--line:#2A3754;
  --turmeric:#EFB13E;--turm-soft:rgba(239,177,62,.2);--leaf:#4CB97F;--chili:#E4687F;--sky:#6AA5E8;--on-ink:#0F1626;--shadow:0 10px 30px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num,.nx time,.lvl{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif}
.num,.nx time,.m .v,.track .tick{font-variant-numeric:tabular-nums}
h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.08;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;line-height:1.25;margin:0 0 .5rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.02rem;margin:0 0 .35rem;font-weight:700}
p{margin:.35rem 0}
a{color:var(--sky)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.brand i{display:inline-block;width:30px;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ink) 52%,var(--turmeric) 52%)}
.lvl{font-size:.82rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);cursor:pointer;white-space:nowrap}
.sync{margin-left:auto;font-size:.8rem;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px;cursor:pointer;text-align:right}
.sync b{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok b{background:var(--leaf)} .sync.warn b{background:var(--chili)} .sync.busy b{background:var(--turmeric)}

main{max-width:1040px;margin:0 auto;padding:6px 16px 160px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.flat{background:transparent;border-style:dashed}
.grid2{display:grid;gap:0 18px}
@media (min-width:880px){.grid2{grid-template-columns:1.15fr .85fr;align-items:start}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.stack>*+*{margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.accent{background:var(--turmeric);color:#1b1405;border-color:var(--turmeric);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.88rem;border-radius:8px}
.btn.icon{padding:4px 9px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=url],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;min-width:0;font-size:16px}
textarea{resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{width:18px;height:18px}

/* hero + day track (the one bold element) */
.hero{padding:16px 0 2px}
.when{font-size:.95rem;color:var(--muted);margin:0 0 4px}
.track{position:relative;height:96px;margin:16px 6px 2px}
.track .rail{position:absolute;left:0;right:0;top:46px;height:12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.track .past{position:absolute;top:46px;height:12px;border-radius:999px;background:var(--ink)}
.track .window{position:absolute;top:32px;height:40px;border-radius:12px;background:var(--turm-soft);border:2px solid var(--turmeric)}
.track .nowdot{position:absolute;top:40px;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--turmeric)}
.track .pin{position:absolute;top:2px;transform:translateX(-50%);text-align:center;font-size:.72rem;color:var(--muted);line-height:1.1;white-space:nowrap}
.track .pin b{display:block;margin:5px auto 0;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.track .pin.done b{background:var(--ink)}
.track .cookmark{position:absolute;top:38px;width:4px;height:28px;margin-left:-2px;border-radius:2px;background:var(--sky)}
.track .trainseg{position:absolute;top:46px;height:12px;border-radius:999px;background:var(--sky)}
.track .cut{position:absolute;top:64px;width:2px;height:9px;background:var(--chili);margin-left:-1px}
.track .tick{position:absolute;top:78px;font-size:.76rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:2px 6px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* next 3 hours */
.nx-h{font-size:.98rem;color:var(--muted);font-weight:700;margin:4px 0 2px}
.nx-h+.nx{margin-bottom:10px}
.nx{list-style:none;margin:0;padding:0}
.nx li{display:grid;grid-template-columns:70px 1fr auto;gap:4px 10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.nx li:first-child{border-top:0}
.nx.steady li{grid-template-columns:1fr auto}
.nx time{font-weight:700;font-size:.92rem;line-height:1.4;color:var(--muted);padding-top:1px}
.nx .body{border-left:3px solid var(--c,var(--line));padding-left:10px;min-width:0}
.nx .t{font-weight:700;line-height:1.35}
.nx .sub{font-size:.88rem;color:var(--muted);margin-top:2px}
.nx li.late time{color:var(--chili)}
.nx li.done .t{color:var(--muted)}
.nx li.done .t::after{content:" ✓";color:var(--leaf)}
.nx li.low{opacity:.8}
.nx .btn{align-self:center}
.k-food{--c:var(--turmeric)} .k-order{--c:var(--ink)} .k-train{--c:var(--sky)} .k-cut{--c:var(--chili)}
.k-water{--c:var(--sky)} .k-steps{--c:var(--leaf)} .k-stand{--c:var(--leaf)} .k-supp{--c:var(--muted)}
.empty-state{padding:6px 0}

/* metric rows */
.m{display:grid;grid-template-columns:80px 1fr 8.2em;gap:2px 10px;align-items:center;padding:6px 0}
.m .l{font-size:.92rem}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--ink))}
.bar u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--turmeric);text-decoration:none}
.m .v{font-size:.88rem;text-align:right;white-space:nowrap}
.m .s{grid-column:2/4;font-size:.78rem;color:var(--muted)}
.st-behind{--c:var(--chili)} .st-ahead,.st-done,.st-on{--c:var(--leaf)} .st-over{--c:var(--chili)} .st-neutral{--c:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.quick .btn{padding:12px 8px;text-align:center;white-space:normal}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .when-col{width:66px;flex:none;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.weighed{border-color:var(--leaf);color:var(--leaf)}
.tag.described{border-color:var(--chili);color:var(--chili)}
.results{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 11px;cursor:pointer}
.results button:hover{background:var(--surface2)}
.plate li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.plate li .ctrls{grid-column:1/-1;display:grid;grid-template-columns:64px 1fr 1.3fr;gap:6px}
.stars{white-space:nowrap}
.stars button{background:none;border:0;padding:2px;cursor:pointer;font-size:1.05rem;color:var(--line)}
.stars button.on{color:var(--turmeric)}

/* planner */
.plan{overflow-x:auto;margin:0 -4px}
.plan table{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.plan th{font-size:.82rem;color:var(--muted);font-weight:400;text-align:left}
.plan td{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;vertical-align:top;font-size:.88rem;width:32%}
.plan td.today{border-color:var(--turmeric);border-width:2px}
.plan td.past{opacity:.55}
.plan td.off{background:transparent;border-style:dashed;color:var(--muted)}
.plan td .acts{display:flex;gap:4px;margin-top:6px}
.plan tbody th span{display:block}
@media (max-width:640px){
  .plan{overflow:visible;margin:0}
  .plan table,.plan tbody,.plan tr,.plan th,.plan td{display:block;min-width:0;width:auto}
  .plan table{border-spacing:0}
  .plan thead{display:none}
  .plan tbody th{color:var(--ink);font-weight:700;font-size:.98rem;margin:14px 0 6px}
  .plan tbody th span{display:inline;margin-left:4px;font-weight:400;color:var(--muted)}
  .plan td{margin:0 0 6px}
  .plan td[data-slot]::before{content:attr(data-slot);display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
}
pre.msg-preview{white-space:pre-wrap;margin:0 0 8px;font:inherit;font-size:.9rem;background:var(--surface2);border-radius:10px;padding:10px}
.sent{color:var(--leaf);font-weight:700;font-size:.88rem}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--ink);cursor:pointer} .chart .b.hit{fill:var(--leaf)} .chart .b.miss{fill:var(--chili)}
.chart .b:hover{opacity:.8}
.chart .tg{stroke:var(--turmeric);stroke-width:2;stroke-dasharray:5 4;fill:none}
.chart .ln{stroke:var(--sky);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--sky)}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .num{font-size:1.55rem;font-weight:800;line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:3px;font-size:.85rem}
.badge.locked{opacity:.45}
.prog{height:8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--turmeric)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button.on svg{color:var(--turmeric)}

/* chat */
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;padding:13px 19px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,15,28,.45)}
.sheet.open{display:block}
.sheet-in{position:absolute;right:0;bottom:0;top:0;width:min(460px,100%);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px 16px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.acts-card{border:1px dashed var(--turmeric);border-radius:12px;padding:10px;margin:4px 0 10px;background:var(--surface)}
.composer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}
.chips{padding:0 16px 6px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--on-ink);padding:8px 8px 8px 16px;border-radius:999px;font-size:.92rem;display:none;align-items:center;gap:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast button{background:transparent;color:var(--turmeric);border:0;font-weight:700;padding:4px 10px;cursor:pointer}
.warnbox{border:1px solid var(--turmeric);background:var(--turm-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.errbox{border:1px solid var(--chili);border-radius:12px;padding:10px 12px;margin:10px 0;color:var(--chili)}
@media (prefers-reduced-motion:no-preference){.track .window,.track .nowdot{transition:left .4s,width .4s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i aria-hidden="true"></i>Pace</div>
  <button class="lvl" id="lvl" data-act="tab" data-v="trends"></button>
  <button class="sync" id="sync" data-act="syncInfo"><b></b><span></span></button>
</div></header>
<main id="main"></main>
<button class="fab" data-act="openChat">Ask Pace</button>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet" id="chat" aria-hidden="true"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Chat with Pace">
  <div class="sheet-head"><h2 style="margin:0">Ask Pace</h2><span class="muted small" style="flex:1">Say what you ate or how you feel</span><button class="btn sm" data-act="closeChat">Close</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="row chips" id="chatChips"></div>
  <div class="composer"><label class="sr" for="chatIn">Message</label><textarea id="chatIn" rows="1" placeholder="e.g. had 2 chicken rolls at the canteen at 1, feeling full"></textarea><button class="btn primary" data-act="sendChat">Send</button></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndo" data-act="undo" hidden>Undo</button></div>
<script>
/* =========================================================
   Pace v2: personal pacing tracker.
   Data lives on this device and syncs to your Google Sheet.
   ========================================================= */

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const toMin = t => { if (t === null || t === undefined || t === '') return null; const [h, m] = String(t).split(':').map(Number); return isFinite(h) ? h * 60 + (m || 0) : null; };
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const fmtMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; let h = Math.floor(m / 60); const mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(mm) + ' ' + ap; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n * 10) / 10;
const fmtN = n => Math.round(n).toLocaleString('en-IN');
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const weekday = ds => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(ds + 'T12:00:00').getDay()];
const mondayOf = ds => { const d = new Date(ds + 'T12:00:00'); return addDays(ds, -((d.getDay() + 6) % 7)); };
const niceDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
const shortDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const jparse = (v, dflt) => { if (v && typeof v === 'object') return v; try { return v ? JSON.parse(v) : dflt; } catch (e) { return dflt; } };

/* ---------- the day runs 4 AM to 4 AM ----------
   You often sleep after midnight, so a day doesn't end at 12. Anything before
   4 AM belongs to the previous day, and its clock time counts past 24:00. */
const DAY_START = 240;
function logical(dt = new Date()) {
  const m = dt.getHours() * 60 + dt.getMinutes();
  if (m < DAY_START) { const y = new Date(dt); y.setDate(y.getDate() - 1); return { date: dstr(y), min: m + 1440 }; }
  return { date: dstr(dt), min: m };
}
const today = () => logical().date;
const nowMin = () => logical().min;
const stamp = (dt = new Date()) => dstr(dt) + 'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + ':' + pad(dt.getSeconds());
// Timestamp for a clock time on a given day; times before 4 AM fall on the next calendar date.
function tsAt(date, hm) {

/* ---------- meal planner ---------- */
// Plans from now onwards only: past days and meals Didi has already cooked are left alone.

}

  const used = {}; let changed = 0;
  S.db.Plan.filter(x => x.date >= monday && x.date <= addDays(monday, 6)).forEach(x => { used[x.template_id] = (used[x.template_id] || 0) + 1; });
  for (let i = 0; i < 6; i++) {   // Monday to Saturday; Didi is off on Sunday
    const d = addDays(monday, i);
    for (const [slot] of SLOTS) {

      if (ex && ex.locked === 'yes') continue;

        if (prevDay && prevDay.template_id === t.id) s -= 10;

/* ----- Trends ----- */
function barsSVG(vals, tgts, hitFn, days, label) {
  const W = 600, H = 150, n = vals.length, max = Math.max(1, ...vals, ...tgts) * 1.12, bw = W / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">`;
  vals.forEach((v, i) => {
    const h = Math.max(v ? 2 : 0, v / max * H);
    s += `<rect class="b ${v ? (hitFn(i) ? 'hit' : 'miss') : ''}" x="${i * bw + bw * .15}" y="${H - h}" width="${bw * .7}" height="${h}" rx="3" data-act="gotoDay" data-v="${days[i]}"><title>${esc(shortDate(days[i]))}: ${fmtN(v)}</title></rect>`;
  });
  s += `<polyline class="tg" points="${tgts.map((t, i) => `${i * bw},${H - t / max * H} ${(i + 1) * bw},${H - t / max * H}`).join(' ')}"/></svg>`;
  return s;
}
function lineSVG(pts) {
  if (pts.length < 2) return `<p class="muted small">Two or more weigh-ins will show a trend here. Add weight in your check-in, or take tape measurements.</p>`;
  const W = 600, H = 150, ys = pts.map(p => p[1]), lo = Math.min(...ys) - 0.5, hi = Math.max(...ys) + 0.5, x0 = pts[0][0], x1 = pts[pts.length - 1][0];
  const X = x => (x - x0) / ((x1 - x0) || 1) * (W - 20) + 10, Y = y => H - 10 - (y - lo) / ((hi - lo) || 1) * (H - 20);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight from ${ys[0]} to ${ys[ys.length - 1]} kg"><polyline class="ln" points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>${pts.map(p => `<circle class="pt" cx="${X(p[0])}" cy="${Y(p[1])}" r="4"/>`).join('')}</svg>
    <div class="axis"><span>Low ${lo.toFixed(1)} kg</span><span>Latest ${ys[ys.length - 1]} kg</span><span>High ${hi.toFixed(1)} kg</span></div>`;
}
function vTrends() {
  const G = game(), n = S.trendDays, t = today(), days = []; for (let i = n - 1; i >= 0; i--) days.push(addDays(t, -i));
  const ev = days.map(d => G.evals[d] || dayEval(d));
  let h = `<section class="hero"><div class="row sp"><h1>Trends</h1><div class="row" role="group" aria-label="Range">${[7, 28].map(k => `<button class="chip ${n === k ? 'on' : ''}" data-act="range" data-v="${k}" aria-pressed="${n === k}">${k} days</button>`).join('')}</div></div></section>`;
  h += `<div class="card"><h2>Level ${G.level}</h2><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${G.span}" aria-valuenow="${G.into}"><i style="width:${clamp(G.into / G.span * 100, 0, 100)}%"></i></div><p class="small muted">${fmtN(G.into)} of ${fmtN(G.span)} points to level ${G.level + 1}</p>
    <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="num">${G.cur}</div><div class="small muted">day streak${G.passReady ? ', rest pass ready' : ''}</div></div>
    <div class="kpi"><div class="num">${G.best}</div><div class="small muted">longest streak</div></div><div class="kpi"><div class="num">${fmtN(G.pts)}</div><div class="small muted">total points</div></div>

    <div style="margin-top:8px">${G.badges.map(([l, ok]) => `<span class="badge ${ok ? '' : 'locked'}">${ok ? '★' : '☆'} ${esc(l)}</span>`).join('')}</div></div>`;
  const act = ev.filter(e => e.active);

  h += `<div class="card"><h2>Adherence</h2><p class="small muted">Share of logged days you reached 90% of each target.</p><div class="kpis">${Object.keys(CH_METRICS).map(m => `<div class="kpi"><div class="num">${rate(m)}%</div><div class="small muted">${METRICS[m].label}</div></div>`).join('')}</div></div>`;

    return `<div class="card"><h3>${title}</h3>${barsSVG(vals, tg, hit, days, `${title} per day`)}<div class="axis"><span>${shortDate(days[0])}</span><span>Average on logged days: ${fmtM(k, avg)} ${METRICS[k].unit}</span><span>Today</span></div></div>`;
  };
  h += `<p class="small muted">Tap any bar to open that day's log. Green bars hit the target; the dashed line is the target.</p>`;
  h += `<div class="grid2"><div>${chart('protein', 'Protein')}${chart('water', 'Water')}${chart('fibre', 'Fibre')}</div><div>${chart('kcal', 'Calories')}${chart('steps', 'Steps')}`;
  const wpts = weightSeries().map(p => [dayDiff(t, p[0]), p[1]]);

  const sl = days.map(d => { const c = checkin(d), hh = S.db.Health.find(x => x.date === d); return num(c && c.sleep_hours) || num(hh && hh.sleep_hours); });
  const slLogged = sl.filter(Boolean);
  h += `<div class="card"><h3>Sleep</h3>${barsSVG(sl, sl.map(() => 8), i => sl[i] >= 7, days, 'Sleep hours per night')}<div class="axis"><span>Dashed line: 8 hours</span><span>Average ${slLogged.length ? r1(slLogged.reduce((a, b) => a + b, 0) / slLogged.length) : 0} h</span></div></div></div></div>`;
  return h;
}

function findDish(x) {
  if (x.dish_id && dishById(x.dish_id)) return dishById(x.dish_id);
  const name = String(x.name || '').trim().toLowerCase();
  return name ? S.db.Dishes.find(d => String(d.name).toLowerCase() === name) : null;
}
function actionFood(x) {
  const dish = findDish(x), q = num(x.qty) || 1;
  if (dish) return { dish, q, n: dishTotals(dish, q, 'serving') };
  return { dish: null, q, n: { kcal: num(x.kcal), protein: num(x.protein), carbs: num(x.carbs), fat: num(x.fat), fibre: num(x.fibre), water_ml: num(x.water_ml) } };
}
function describeAction(a) {
  const at = a.time && toMin(a.time) !== null ? ` at ${fmtMin(toMin(a.time))}` : '';
  if (a.type === 'food') { const { dish, q, n } = actionFood(a); return `Food: ${esc(a.name || (dish && dish.name))} × ${r1(q)}${at} (${Math.round(n.kcal)} kcal, ${r1(n.protein)} g protein)`; }
  if (a.type === 'water') return `Water: ${fmtN(num(a.ml))} ml${at}`;
  if (a.type === 'creatine') return `Creatine: ${r1(num(a.g) || prof().creatine)} g`;
  if (a.type === 'stand') return 'Stood for an hour';
  if (a.type === 'steps') return `Steps without a phone: ${fmtN(num(a.steps))}`;
  if (a.type === 'feeling') return `Feeling: ${esc(a.text)}`;
  if (a.type === 'weight') return `Weight: ${r1(num(a.kg))} kg`;
  return esc(JSON.stringify(a));
}
function chatContext() {
  const d = today(), T = targets(d), A = totals(d), p = prof(), N = next3h(d);
  return { now: `${niceDate(d)}, ${fmtMin(nowMin())}`, profile: { age: p.age, height_cm: p.height, weight_kg: T.weight, goal: p.goal, day_type: T.dayType, bodyfat_est: T.bf },
    targets: Object.fromEntries(Object.keys(METRICS).map(k => [k, T[k]])), today_totals: Object.fromEntries(Object.keys(METRICS).map(k => [k, A[k]])),
    next_3_hours: [...N.timed, ...N.steady].map(i => (i.t !== undefined ? fmtMin(i.t) + ' ' : '') + i.text + (i.sub ? ' (' + i.sub + ')' : '')),
    plan_today: SLOTS.map(([s]) => { const x = plannedFor(d, s); return x ? `${s}: ${x.name}` : null; }).filter(Boolean),
    logged_today: (S.idx[d] || []).filter(r => r.kind === 'food').map(r => `${fmtMin(tsMin(r) || 0)} ${r.name} x${r1(num(r.qty) || 1)}`),
    feelings_today: (S.idx[d] || []).filter(r => r.kind === 'feeling').map(r => `${fmtMin(tsMin(r) || 0)} ${r.name}`),
    dishes: S.db.Dishes.map(x => [x.id, x.name, x.serving, num(x.kcal), num(x.protein), num(x.carbs), num(x.fat), num(x.fibre), num(x.water_ml)]) };
}
async function sendChat(text) {
  text = (text || '').trim(); if (!text || S.chatBusy) return;
  if (!S.cfg.url) { toast('Chat runs through your Google Sheet. Connect it in Me first.'); return; }
  const d = today(), tmpId = uid('u');
  S.db.Chat.push({ id: tmpId, ts: stamp(), date: d, role: 'user', text, actions: '', pending: true });
  S.chatBusy = true; $('#chatIn').value = ''; renderChat();
  try {
    const j = await api('chat', { message: text, context: chatContext(), date: d, userId: tmpId }, 90000);
    S.db.Chat = S.db.Chat.filter(r => r.id !== tmpId); S.db.Chat.push(j.userRow, j.botRow); persist();
  } catch (e) {
    const u = S.db.Chat.find(r => r.id === tmpId); if (u) delete u.pending;
    S.db.Chat.push({ id: uid('a'), ts: stamp(new Date(Date.now() + 1000)), date: d, role: 'assistant', text: 'Pace couldn\'t answer: ' + e.message, actions: '', retry: text, userTmp: tmpId });
  }
  S.chatBusy = false; renderChat();
}
function applyActions(rowId) {
  const r = S.db.Chat.find(x => x.id === rowId); if (!r) return;
  const a = jparse(r.actions, null); if (!a || !a.items) return;
  const d = today(), ids = [];
  a.items.forEach(x => {
    const ts = x.time && toMin(x.time) !== null ? tsAt(d, x.time) : stamp();
    const base = { id: uid('l'), date: d, ts, source: 'chat' };
    let row = null;
    if (x.type === 'food') { const { dish, q, n } = actionFood(x); row = { ...base, kind: 'food', name: x.name || (dish && dish.name) || 'Food', dish_id: dish ? dish.id : '', qty: q, unit: 'serving', grams: '', ...n, confidence: dish ? (x.confidence === 'described' ? 'described' : 'estimated') : 'described' }; }
    else if (x.type === 'water') row = { ...base, kind: 'water', name: 'Water', water_ml: num(x.ml) };
    else if (x.type === 'creatine') row = { ...base, kind: 'creatine', name: 'Creatine', value: num(x.g) || prof().creatine };
    else if (x.type === 'stand') row = { ...base, kind: 'stand', name: 'Stood', value: 1 };
    else if (x.type === 'steps') row = { ...base, kind: 'steps', name: 'Steps', value: num(x.steps) };
    else if (x.type === 'feeling') row = { ...base, kind: 'feeling', name: String(x.text || '') };
    else if (x.type === 'weight' && num(x.kg)) { const c = checkin(d); if (c) save('Checkins', { ...c, weight: num(x.kg) }); else save('Measurements', { id: uid('m'), date: d, weight: num(x.kg) }); }
    if (row) { save('Log', row); ids.push(row.id); }
  });
  a.applied = true; a.logged = ids; save('Chat', { ...r, actions: JSON.stringify(a) });
  offerUndo(`Logged ${ids.length} item${ids.length === 1 ? '' : 's'}`, () => { ids.forEach(id => remove('Log', id)); const b = jparse(r.actions, {}); b.applied = false; b.logged = []; save('Chat', { ...r, actions: JSON.stringify(b) }); });
  render();
}

/* ---------- feedback with undo ---------- */
function toast(text, undoFn) {
  $('#toastText').textContent = text;
  S.undo = undoFn || null; $('#toastUndo').hidden = !undoFn;
  const el = $('#toast'); el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.classList.remove('show'); S.undo = null; }, undoFn ? 6000 : 2600);
}
const offerUndo = (text, fn) => toast(text, fn);
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
function quickLog(kind, extra, msg) {
  const row = { id: uid('l'), date: today(), ts: stamp(), kind, source: 'quick', ...extra };
  save('Log', row); render(); offerUndo(msg, () => { remove('Log', row.id); render(); });
}
function addToPlate(dish, qty = 1) { if (dish) S.plate.push({ dish: { ...dish }, qty, unit: 'serving', grams: Math.round(num(dish.grams) * qty), confidence: 'estimated' }); }
async function copyText(t) {
  try {
    // Some browsers leave this waiting on a permission prompt; don't wait forever.
    await Promise.race([navigator.clipboard.writeText(t), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 1500))]);
    return true;
  } catch (e) { /* fall through */ }
  // Older fallback that also works where the clipboard API is blocked.
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
function markOrderSent(part) { const d = today(); if (!orderSent(d, part)) save('Log', { id: uid('o'), date: d, ts: stamp(), kind: 'order', name: part, source: 'meals' }); }

const ACT = {
  tab: b => { S.tab = b.dataset.v; if (S.tab === 'log') S.day = today(); S.editDish = null; render(); window.scrollTo(0, 0); },
  goLog: () => { S.tab = 'log'; S.day = today(); render(); window.scrollTo(0, 0); setTimeout(() => { const s = $('#search'); if (s) s.focus(); }, 60); },
  water: b => quickLog('water', { name: 'Water', water_ml: Number(b.dataset.v) }, `Added ${b.dataset.v} ml water`),
  creatine: () => quickLog('creatine', { name: 'Creatine', value: prof().creatine }, 'Creatine logged'),
  stood: () => quickLog('stand', { name: 'Stood', value: 1 }, 'Standing hour logged'),
  steps: b => quickLog('steps', { name: 'Steps', value: Number(b.dataset.v) }, `Added ${fmtN(Number(b.dataset.v))} steps`),
  feel: () => { const t = val('feelIn'); if (!t) { toast('Type how you feel first'); return; } quickLog('feeling', { name: t }, 'Noted. Your next 3 hours now account for it.'); },
  ciQ: b => { ciCapture(); S.ci.q = Number(b.dataset.v); render(); },
  ciType: b => { ciCapture(); S.ci.type = b.dataset.v; render(); },
  editCheckin: () => { S.ci = null; ciInit(today()); S.editingCheckin = true; render(); const f = $('#ci'); if (f) f.scrollIntoView({ block: 'start' }); },
  cancelCheckin: () => { S.editingCheckin = false; S.ci = null; render(); },
  saveCheckin: () => {
    ciInit(today()); ciCapture();
    const d = today(), ci = S.ci;
    if (!ci.wake) { toast('Add the time you woke up'); return; }
    save('Checkins', { id: 'c-' + d, date: d, wake: ci.wake, bed: ci.bed || prof().bed, sleep_hours: num(ci.sleep) || '', sleep_q: ci.q || '', weight: num(ci.kg) || '', day_type: ci.type, train_time: ci.type !== 'rest' ? ci.train : '', note: '' });
    const was = S.editingCheckin; S.editingCheckin = false; S.ci = null;
    toast(was ? 'Check-in updated' : 'Your day is set'); render();
  },
  day: b => { S.day = addDays(S.day, Number(b.dataset.v)); if (S.day > today()) S.day = today(); S.plate = []; render(); },
  gotoDay: b => { S.day = b.dataset.v; S.tab = 'log'; render(); window.scrollTo(0, 0); },
  dishToPlate: b => { addToPlate(dishById(b.dataset.v)); if (S.tab !== 'log') { S.tab = 'log'; S.day = today(); } render(); },
  tplToPlate: b => { templateItems(tplById(b.dataset.v)).forEach(([id, q]) => addToPlate(dishById(id), q)); if (S.tab !== 'log') { S.tab = 'log'; S.day = today(); window.scrollTo(0, 0); } render(); },
  pDel: b => { S.plate.splice(Number(b.dataset.v), 1); render(); },
  clearPlate: () => { S.plate = []; S.savingTpl = false; render(); },
  addCustom: () => {
    const name = val('cName'); if (!name) { toast('Give it a name first'); return; }
    const dish = { id: 'x_' + Date.now().toString(36), name, serving: val('cServ') || '1 serving', grams: 100, kcal: num(val('cKcal')), protein: num(val('cP')), carbs: num(val('cC')), fat: num(val('cF')), fibre: num(val('cFi')), water_ml: 0, diet: 'veg', slots: 'lunch,dinner', rating: 3, source: 'order', cook_name: name };
    if ($('#cSave').checked) save('Dishes', dish);
    S.plate.push({ dish, qty: 1, unit: 'serving', grams: 100, confidence: 'described' }); render();
  },
  logPlate: () => {
    const d = S.day, t = val('logT') || hhmm(nowMin()), ids = [];
    S.plate.forEach(it => {
      const x = dishTotals(it.dish, it.qty, it.unit, it.grams), id = uid('l'); ids.push(id);
      save('Log', { id, date: d, ts: tsAt(d, t), kind: 'food', name: it.dish.name, dish_id: it.dish.id, qty: it.unit === 'g' ? '' : it.qty, unit: it.unit, grams: it.unit === 'g' ? it.grams : '', ...x, confidence: it.confidence, source: 'manual' });
    });
    const kept = S.plate; S.plate = []; S.savingTpl = false; render();
    offerUndo('Meal logged', () => { ids.forEach(id => remove('Log', id)); S.plate = kept; render(); });
  },
  saveTplStart: () => { S.savingTpl = true; render(); const el = $('#tplName'); if (el) el.focus(); },
  saveTplCancel: () => { S.savingTpl = false; render(); },
  saveTpl: () => {
    const name = val('tplName'); if (!name) { toast('Give the meal a name'); return; }
    const items = S.plate.filter(p => dishById(p.dish.id)).map(p => [p.dish.id, p.unit === 'g' ? r1(p.grams / (num(p.dish.grams) || 100)) : p.qty]);
    if (!items.length) { toast('Save the new dishes first, then save the meal'); return; }
    save('Templates', { id: uid('t'), name, items: JSON.stringify(items), slot: 'breakfast,lunch,dinner', rating: 4, cook_text: name });
    S.savingTpl = false; toast('Meal saved. The planner can use it now.'); render();
  },
  delLog: b => { const row = S.db.Log.find(r => r.id === b.dataset.v); if (!row) return; remove('Log', row.id); render(); offerUndo('Entry deleted', () => { save('Log', row); render(); }); },
  wk: b => { S.planWeek = addDays(S.planWeek, Number(b.dataset.v)); render(); },
  planWeek: () => { const n = planWeek(S.planWeek); toast(n ? `Planned ${n} meal${n > 1 ? 's' : ''}` : 'Nothing left to plan this week'); render(); },
  reroll: b => {
    const [d, slot] = b.dataset.v.split('|'), ex = S.db.Plan.find(x => x.date === d && x.slot === slot);
    const cands = S.db.Templates.filter(t => String(t.slot).split(',').includes(slot) && (!ex || t.id !== ex.template_id));
    if (!cands.length) { toast('No other saved meals fit this slot'); return; }
    const weights = cands.map(t => Math.pow(num(t.rating) || 3, 2)), tot = weights.reduce((a, c) => a + c, 0);
    let r = Math.random() * tot, pick = cands[0];
    for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r <= 0) { pick = cands[i]; break; } }
    save('Plan', { id: `p-${d}-${slot}`, date: d, slot, template_id: pick.id, note: '', locked: 'no' }); render();
  },
  lock: b => { const x = S.db.Plan.find(r => r.id === b.dataset.v); if (x) { save('Plan', { ...x, locked: x.locked === 'yes' ? 'no' : 'yes' }); render(); } },
  sendOrder: async b => {
    const part = b.dataset.v, msg = cookMsg(today(), part); if (!msg) return;
    markOrderSent(part); render();
    const ok = await copyText(msg);
    toast(ok ? `${part === 'morning' ? 'Morning' : 'Evening'} order copied. Paste it into WhatsApp.` : 'Copying was blocked. Use Send on WhatsApp in Meals instead.');
  },
  markSent: b => { markOrderSent(b.dataset.v); setTimeout(render, 300); },
  copyWeek: async () => { toast(await copyText(weekMsg(S.planWeek)) ? 'Week plan copied' : 'Copying was blocked on this device'); },
  rate: b => { const [id, s] = b.dataset.v.split('|'); const x = dishById(id); if (x) { save('Dishes', { ...x, rating: Number(s) }); render(); } },
  rateTpl: b => { const [id, s] = b.dataset.v.split('|'); const x = tplById(id); if (x) { save('Templates', { ...x, rating: Number(s) }); render(); } },
  delTpl: b => { const x = tplById(b.dataset.v); if (!x) return; remove('Templates', x.id); render(); offerUndo('Saved meal deleted', () => { save('Templates', x); render(); }); },
  editDish: b => { S.editDish = b.dataset.v || null; render(); if (S.editDish) { const e = $('#dishEditor'); if (e) e.scrollIntoView({ block: 'center' }); } },
  saveDish: b => {
    const g = k => val('e_' + k), id = b.dataset.v || ('x_' + Date.now().toString(36));
    if (!g('name')) { toast('Add a name'); return; }
    const old = dishById(id) || {};
    save('Dishes', { ...old, id, name: g('name'), serving: g('serving') || '1 serving', grams: num(g('grams')) || 100, kcal: num(g('kcal')), protein: num(g('protein')), carbs: num(g('carbs')), fat: num(g('fat')), fibre: num(g('fibre')), water_ml: num(g('water_ml')), diet: g('diet'), slots: g('slots') || 'lunch,dinner', cook_name: g('cook_name') || g('name'), rating: old.rating || 4, source: old.source || 'cook' });
    S.editDish = null; toast('Dish saved'); render();
  },
  delDish: b => { const x = dishById(b.dataset.v); if (!x) return; remove('Dishes', x.id); S.editDish = null; render(); offerUndo('Dish deleted. Past logs keep their numbers.', () => { save('Dishes', x); render(); }); },
  range: b => { S.trendDays = Number(b.dataset.v); render(); },
  saveProfile: () => {
    ['age', 'height', 'weight', 'wake', 'bed', 'meal_breakfast', 'meal_lunch', 'meal_snack', 'meal_dinner', 'cook_morning', 'cook_evening', 'steps_target', 'stand_target', 'creatine_g', 'sex', 'goal'].forEach(k => {
      const el = document.getElementById('p_' + k); if (!el) return;
      const v = el.value.trim();
      if (v === '' && ['height', 'weight', 'wake', 'bed', 'sex', 'goal'].includes(k)) return;   // these can't be blank
      if (v !== String(S.db.profile[k] ?? '')) setProfile(k, v);
    });
    toast('Profile saved'); render();
  },
  saveTargets: () => { Object.keys(METRICS).forEach(k => { const v = val('t_' + k); if (v !== String(S.db.profile['t_' + k] ?? '')) setProfile('t_' + k, v); }); toast('Targets saved'); render(); },
  saveMeasure: () => {
    const row = { id: uid('m'), date: today(), note: '' }; let any = false;
    ['weight', 'waist', 'neck', 'chest', 'arm', 'thigh', 'hip'].forEach(k => { const v = num(val('m_' + k)); row[k] = v || ''; if (v) any = true; });
    if (!any) { toast('Enter at least one measurement'); return; }
    save('Measurements', row); if (row.weight) setProfile('weight', row.weight); toast('Measurements saved'); render();
  },
  delMeasure: b => { const x = S.db.Measurements.find(m => m.id === b.dataset.v); if (!x) return; remove('Measurements', x.id); render(); offerUndo('Measurements deleted', () => { save('Measurements', x); render(); }); },
  connect: async () => {
    const url = val('cfgUrl'), token = val('cfgTok');
    S.cfg = { url, token }; localStorage.setItem('pace.cfg', JSON.stringify(S.cfg));
    if (!url) { S.sync = 'local'; S.queue = []; saveQueue(); render(); toast('Disconnected. Data stays on this device.'); return; }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { S.syncErr = 'That doesn\'t look like an Apps Script Web app URL. It should start with https://script.google.com/'; render(); return; }
    setSync('saving');
    try {
      const j = await api('ping');
      const hasLocal = S.db.Log.length || S.db.Checkins.length || S.db.Measurements.length;
      if (hasLocal && confirm('Upload the data already on this device to your Sheet?')) {
        TABLES.filter(t => t !== 'Chat').forEach(t => S.db[t].forEach(row => S.queue.push({ op: 'put', table: t, row })));
        Object.entries(S.db.profile).forEach(([key, value]) => S.queue.push({ op: 'put', table: 'Profile', row: { key, value } }));
        saveQueue();
      }
      S.syncErr = '';
      await flush(); await pull();
      toast(j.chat ? 'Connected, and chat is on' : 'Connected. Add GEMINI_API_KEY in Apps Script to turn on chat.');
    } catch (e) { S.syncErr = e.message; setSync('offline'); render(); }
  },
  syncNow: () => { flush().then(pull); },
  syncInfo: () => { if (!S.cfg.url) { ACT.tab({ dataset: { v: 'me' } }); return; } if (S.syncErr) toast(S.syncErr); else { toast('Syncing…'); flush().then(pull); } },
  export: () => { const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pace-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); },
  openChat: () => { $('#chat').classList.add('open'); $('#chat').setAttribute('aria-hidden', 'false'); renderChat(); setTimeout(() => $('#chatIn').focus(), 50); },
  closeChat: () => { $('#chat').classList.remove('open'); $('#chat').setAttribute('aria-hidden', 'true'); },
  sendChat: () => sendChat($('#chatIn').value),
  chip: b => { const v = b.dataset.v; if (v.endsWith(' ')) { $('#chatIn').value = v; $('#chatIn').focus(); } else sendChat(v); },
  applyActs: b => applyActions(b.dataset.v),
  skipActs: b => { const r = S.db.Chat.find(x => x.id === b.dataset.v); if (!r) return; const a = jparse(r.actions, {}); a.applied = true; a.items = []; save('Chat', { ...r, actions: JSON.stringify(a) }); renderChat(); },
  retryChat: b => { const r = S.db.Chat.find(x => x.id === b.dataset.v); if (!r) return; S.db.Chat = S.db.Chat.filter(x => x.id !== r.id && x.id !== r.userTmp); sendChat(r.retry); },
  copyHook: async () => { toast(await copyText(val('hookUrl')) ? 'Webhook URL copied' : 'Copying was blocked. Select the URL and copy it by hand.'); },
  undo: () => { const fn = S.undo; S.undo = null; $('#toast').classList.remove('show'); if (fn) fn(); }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName !== 'A') e.preventDefault();   // links (WhatsApp) still open
  fn(b, e);
});
$('#chat').addEventListener('click', e => { if (e.target.id === 'chat') ACT.closeChat(); });
document.addEventListener('input', e => { if (e.target.dataset.input === 'search') { S.search = e.target.value; $('#results').innerHTML = resultsHTML(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ACT.closeChat();
  if (e.key === 'Enter' && e.target.id === 'feelIn') { e.preventDefault(); ACT.feel(); }
  if (e.key === 'Enter' && e.target.id === 'tplName') { e.preventDefault(); ACT.saveTpl(); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.change; if (!k) return;
  if (k === 'milkshake') { setProfile('milkshake_daily', t.checked ? 'yes' : 'no'); render(); return; }
  const it = S.plate[Number(t.dataset.i)]; if (!it) return;
  if (k === 'pUnit') { it.unit = t.value; if (it.unit === 'g') it.grams = Math.round(num(it.dish.grams) * it.qty); else it.qty = r1(it.grams / (num(it.dish.grams) || 100)) || 1; }
  else if (k === 'pQty') { const v = num(t.value); if (v <= 0) { S.plate.splice(Number(t.dataset.i), 1); } else if (it.unit === 'g') it.grams = v; else it.qty = v; }
  else if (k === 'pConf') it.confidence = t.value;
  render();
});
$('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });

/* ---------- start ---------- */
reindex();
S.sync = S.cfg.url ? 'saving' : 'local';
render();
if (S.cfg.url) { flush(); pull(); }
let lastDay = today();
setInterval(() => {
  if (today() !== lastDay) { lastDay = today(); S.ci = null; S.editingCheckin = false; S.day = today(); }   // 4 AM rollover
  if (S.tab === 'today') safeRender(); else paintSync();
}, 60000);
setInterval(() => { if (S.queue.length) flush(); }, 30000);
window.addEventListener('online', () => { flush(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { safeRender(); if (S.cfg.url) { flush(); pull(); } } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
